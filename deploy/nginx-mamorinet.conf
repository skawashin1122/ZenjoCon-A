# /etc/nginx/sites-available/mamorinet  （setup.sh が DOMAIN を置き換えて設置する）
# HTTPS は certbot --nginx が追記する。静的ファイルは Nginx が直接配る（サーバーのPythonが止まっても もしもカードは使える）
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /opt/mamorinet/static;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # LINE の Webhook だけを FastAPI へ
    location = /callback {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        allow 127.0.0.1;
        deny all;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    # 隠しファイルは見せない
    location ~ /\. { deny all; }
}
